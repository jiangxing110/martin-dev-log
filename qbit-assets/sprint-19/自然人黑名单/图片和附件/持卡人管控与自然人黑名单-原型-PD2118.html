<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<style>
html{color-scheme:light}
body{margin:0;font:14px/1.5 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#fafaf9}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<title>持卡人管控与自然人黑名单</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#eef1f5; --panel:#ffffff; --panel-2:#f7f9fb; --panel-3:#eff3f8;
  --line:#e1e7ef; --line-2:#cfd8e3;
  --ink:#1b2431; --ink-2:#57626f; --ink-3:#8a939f;
  --brand:#1668e3; --brand-2:#0f4fae; --brand-weak:#e7f0fd;
  --ok:#0f7a44; --ok-weak:#e4f5eb;
  --warn:#9a6100; --warn-weak:#fdf0da;
  --danger:#c62f28; --danger-weak:#fdeceb;
  --purple:#6339c4; --purple-weak:#efeafc;
  --nav:#1e2938; --nav-2:#161f2b; --nav-ink:#a7b3c3; --nav-line:#2a3648;
  --shadow:0 1px 2px rgba(20,32,48,.06), 0 8px 24px rgba(20,32,48,.08);
  --radius:6px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e141c; --panel:#161e28; --panel-2:#1b242f; --panel-3:#202b38;
    --line:#27323f; --line-2:#364454;
    --ink:#e5ecf4; --ink-2:#a2afbf; --ink-3:#788595;
    --brand:#5a9bff; --brand-2:#8cbcff; --brand-weak:#12243e;
    --ok:#4fca82; --ok-weak:#11301f;
    --warn:#e2a750; --warn-weak:#33260f;
    --danger:#ff6f64; --danger-weak:#3b1b18;
    --purple:#a189f0; --purple-weak:#241b3d;
    --nav:#111922; --nav-2:#0b1219; --nav-ink:#94a2b3; --nav-line:#1e2733;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 28px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --bg:#0e141c; --panel:#161e28; --panel-2:#1b242f; --panel-3:#202b38;
  --line:#27323f; --line-2:#364454;
  --ink:#e5ecf4; --ink-2:#a2afbf; --ink-3:#788595;
  --brand:#5a9bff; --brand-2:#8cbcff; --brand-weak:#12243e;
  --ok:#4fca82; --ok-weak:#11301f;
  --warn:#e2a750; --warn-weak:#33260f;
  --danger:#ff6f64; --danger-weak:#3b1b18;
  --purple:#a189f0; --purple-weak:#241b3d;
  --nav:#111922; --nav-2:#0b1219; --nav-ink:#94a2b3; --nav-line:#1e2733;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 28px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  font-size:13px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit}
::selection{background:var(--brand-weak)}
:focus-visible{outline:2px solid var(--brand); outline-offset:2px; border-radius:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- shell ---------- */
.app{display:grid; grid-template-columns:216px 1fr; min-height:100vh}
.side{background:var(--nav); border-right:1px solid var(--nav-line); display:flex; flex-direction:column; position:sticky; top:0; height:100vh; overflow-y:auto}
.brand{display:flex; align-items:center; gap:9px; padding:16px 16px 14px; border-bottom:1px solid var(--nav-line)}
.brand .mark{width:24px;height:24px;border-radius:6px;background:linear-gradient(145deg,#3d8bfd,#1450b5);display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px;flex:none}
.brand b{color:#fff;font-size:13.5px;font-weight:600;letter-spacing:.2px}
.brand small{display:block;color:var(--nav-ink);font-size:10.5px;letter-spacing:.6px;text-transform:uppercase}
.navgroup{padding:12px 0 4px}
.navgroup>span{display:block;padding:0 16px 6px;color:#5f6f83;font-size:10.5px;letter-spacing:1.1px;text-transform:uppercase}
.navitem{display:flex;align-items:center;gap:8px;width:100%;padding:8px 16px;background:none;border:0;color:var(--nav-ink);cursor:pointer;text-align:left;font-size:12.5px;border-left:2px solid transparent}
.navitem:hover{background:var(--nav-2);color:#fff}
.navitem[aria-current="page"]{background:var(--nav-2);color:#fff;border-left-color:var(--brand);font-weight:500}
.navitem .dot{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.45;flex:none}
.navitem .tagnew{margin-left:auto;font-size:9.5px;padding:1px 5px;border-radius:3px;background:rgba(255,120,90,.18);color:#ff9b86;letter-spacing:.3px}
.side footer{margin-top:auto;padding:12px 16px;border-top:1px solid var(--nav-line);color:#5f6f83;font-size:10.5px}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:12px;padding:0 20px;height:46px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.crumb{display:flex;align-items:center;gap:6px;color:var(--ink-3);font-size:12px;min-width:0}
.crumb b{color:var(--ink);font-weight:600}
.crumb i{font-style:normal;opacity:.5}
.topbar .spacer{margin-left:auto}
.ghosttoggle{display:flex;align-items:center;gap:7px;padding:4px 10px;border:1px solid var(--line-2);background:var(--panel);border-radius:20px;cursor:pointer;font-size:11.5px;color:var(--ink-2)}
.ghosttoggle[aria-pressed="true"]{background:var(--warn-weak);border-color:var(--warn);color:var(--warn);font-weight:500}
.ghosttoggle .sw{width:22px;height:12px;border-radius:7px;background:var(--line-2);position:relative;flex:none;transition:background .15s}
.ghosttoggle .sw::after{content:"";position:absolute;top:2px;left:2px;width:8px;height:8px;border-radius:50%;background:#fff;transition:transform .15s}
.ghosttoggle[aria-pressed="true"] .sw{background:var(--warn)}
.ghosttoggle[aria-pressed="true"] .sw::after{transform:translateX(10px)}
.wrap{padding:16px 20px 56px;display:grid;gap:12px;max-width:1560px;width:100%}

/* ---------- primitives ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}
.card>.hd{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line)}
.card>.hd h2{margin:0;font-size:13.5px;font-weight:600;letter-spacing:.1px}
.card>.hd .sub{color:var(--ink-3);font-size:11.5px}
.card>.bd{padding:14px}
.tabs{display:flex;gap:2px;padding:0 14px;border-bottom:1px solid var(--line);background:var(--panel)}
.tab{padding:10px 12px;background:none;border:0;border-bottom:2px solid transparent;color:var(--ink-2);cursor:pointer;font-size:13px}
.tab[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand);font-weight:600}
.notice{display:flex;align-items:flex-start;gap:9px;padding:10px 12px;border-radius:var(--radius);background:var(--brand-weak);border:1px solid color-mix(in srgb,var(--brand) 25%,transparent);color:var(--ink);font-size:12.5px}
.notice.warn{background:var(--warn-weak);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.notice.danger{background:var(--danger-weak);border-color:color-mix(in srgb,var(--danger) 32%,transparent)}
.notice .ic{flex:none;width:16px;height:16px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff;background:var(--brand);margin-top:1px}
.notice.warn .ic{background:var(--warn)} .notice.danger .ic{background:var(--danger)}

.btn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:4px;border:1px solid var(--line-2);background:var(--panel);color:var(--ink);cursor:pointer;font-size:12.5px;white-space:nowrap}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand-2);border-color:var(--brand-2);color:#fff}
.btn.danger{border-color:color-mix(in srgb,var(--danger) 55%,transparent);color:var(--danger);background:var(--danger-weak)}
.btn.danger:hover{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.solid-danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.ok{border-color:color-mix(in srgb,var(--ok) 50%,transparent);color:var(--ok);background:var(--ok-weak)}
.btn.warn{border-color:color-mix(in srgb,var(--warn) 50%,transparent);color:var(--warn);background:var(--warn-weak)}
.btn.sm{height:24px;padding:0 9px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn[disabled]:hover{border-color:var(--line-2);color:var(--ink)}
.lnk{background:none;border:0;padding:0;color:var(--brand);cursor:pointer;font-size:12.5px}
.lnk:hover{text-decoration:underline}
.lnk.d{color:var(--danger)}
.lnk.m{color:var(--ink-3);cursor:default}
.lnk.m:hover{text-decoration:none}

.filters{display:grid;grid-template-columns:repeat(auto-fill,minmax(184px,1fr));gap:9px}
.f{display:grid;gap:4px}
.f label{font-size:11.5px;color:var(--ink-2)}
.f label em{font-style:normal;color:var(--brand);font-weight:600}
input,select{height:29px;padding:0 9px;border:1px solid var(--line-2);border-radius:4px;background:var(--panel);color:var(--ink);font:inherit;font-size:12.5px;width:100%;min-width:0}
textarea{padding:7px 9px;border:1px solid var(--line-2);border-radius:4px;background:var(--panel);color:var(--ink);font:inherit;font-size:12.5px;width:100%;resize:vertical}
input::placeholder,textarea::placeholder{color:var(--ink-3)}
input:focus,select:focus,textarea:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px var(--brand-weak)}
.actionbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel-2)}
.selinfo{font-size:12px;color:var(--ink-2)}
.selinfo b{color:var(--brand);font-variant-numeric:tabular-nums}

.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12.5px;min-width:920px}
th{text-align:left;font-weight:600;color:var(--ink-2);background:var(--panel-2);padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:12px}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:hover{background:var(--panel-2)}
tbody tr.sel{background:var(--brand-weak)}
td.num,th.num{font-variant-numeric:tabular-nums}
td.ops{white-space:nowrap}
td.ops .lnk+.lnk{margin-left:9px}
.mono{font-variant-numeric:tabular-nums;letter-spacing:.1px}
.sub2{color:var(--ink-3);font-size:11.5px}
.chk{width:14px;height:14px;accent-color:var(--brand);cursor:pointer;margin:2px 0 0}
.tfoot{display:flex;align-items:center;gap:10px;padding:10px 14px;color:var(--ink-2);font-size:12px}
.tfoot .spacer{margin-left:auto}
.pager{display:flex;gap:4px}
.pager button{width:24px;height:24px;border:1px solid var(--line-2);background:var(--panel);border-radius:4px;cursor:pointer;font-size:12px;color:var(--ink-2)}
.pager button.on{background:var(--brand);border-color:var(--brand);color:#fff}

.tag{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border-radius:3px;font-size:11.5px;line-height:1.6;white-space:nowrap;border:1px solid transparent}
.t-ok{background:var(--ok-weak);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 25%,transparent)}
.t-warn{background:var(--warn-weak);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.t-danger{background:var(--danger-weak);color:var(--danger);border-color:color-mix(in srgb,var(--danger) 30%,transparent)}
.t-info{background:var(--brand-weak);color:var(--brand);border-color:color-mix(in srgb,var(--brand) 25%,transparent)}
.t-purple{background:var(--purple-weak);color:var(--purple);border-color:color-mix(in srgb,var(--purple) 25%,transparent)}
.t-mute{background:var(--panel-3);color:var(--ink-3);border-color:var(--line)}
.t-dot::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}

/* ---------- annotation ---------- */
.pin{display:none;align-items:center;justify-content:center;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--warn);color:#fff;font-size:10px;font-weight:700;cursor:pointer;vertical-align:middle;margin-left:5px;border:0;font-variant-numeric:tabular-nums}
body.anno .pin{display:inline-flex}
body.anno .pin:hover{background:var(--danger)}
.annopanel{display:none;position:fixed;right:0;top:46px;bottom:0;width:310px;background:var(--panel);border-left:1px solid var(--line);z-index:30;overflow-y:auto;box-shadow:-8px 0 24px rgba(20,32,48,.07)}
body.anno .annopanel{display:block}
body.anno .wrap{padding-right:330px}
.annopanel h3{margin:0;padding:12px 14px;font-size:12.5px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:7px}
.annopanel h3 span{margin-left:auto;color:var(--ink-3);font-weight:400;font-size:11px}
.annolist{padding:10px 14px 40px;display:grid;gap:9px}
.annoitem{display:grid;grid-template-columns:20px 1fr;gap:9px;padding:9px;border:1px solid var(--line);border-radius:5px;background:var(--panel-2);font-size:12px;line-height:1.5}
.annoitem.hot{border-color:var(--warn);background:var(--warn-weak)}
.annoitem .n{width:18px;height:18px;border-radius:9px;background:var(--warn);color:#fff;display:grid;place-items:center;font-size:10px;font-weight:700}
.annoitem b{display:block;font-size:11.5px;color:var(--ink-3);font-weight:600;letter-spacing:.2px;margin-bottom:2px}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(16,24,36,.45);display:grid;place-items:center;z-index:80;padding:24px;overflow-y:auto}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);width:min(720px,100%);max-height:calc(100vh - 48px);display:flex;flex-direction:column;animation:pop .16s ease-out}
.modal.wide{width:min(940px,100%)}
.modal.narrow{width:min(470px,100%)}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.99)}to{opacity:1;transform:none}}
.modal>header{display:flex;align-items:center;gap:9px;padding:13px 16px;border-bottom:1px solid var(--line)}
.modal>header h3{margin:0;font-size:14px;font-weight:600}
.modal>header .x{margin-left:auto;background:none;border:0;color:var(--ink-3);cursor:pointer;font-size:17px;line-height:1;padding:2px 4px}
.modal>.body{padding:16px;overflow-y:auto;display:grid;gap:12px}
.modal>footer{display:flex;align-items:center;gap:8px;padding:12px 16px;border-top:1px solid var(--line);background:var(--panel-2);border-radius:0 0 8px 8px}
.modal>footer .spacer{margin-left:auto}

.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:5px;overflow:hidden}
.kv div{background:var(--panel);padding:8px 11px}
.kv dt{margin:0;font-size:11px;color:var(--ink-3)}
.kv dd{margin:1px 0 0;font-size:12.5px}
.checkline{display:flex;gap:9px;align-items:flex-start;padding:11px 12px;border:1px solid var(--line-2);border-radius:5px;background:var(--panel-2);cursor:pointer}
.checkline.armed{border-color:var(--danger);background:var(--danger-weak)}
.checkline input{width:15px;height:15px;accent-color:var(--danger);margin:2px 0 0;flex:none}
.checkline b{display:block;font-size:12.5px}
.checkline p{margin:3px 0 0;font-size:11.5px;color:var(--ink-2)}
.req::after{content:"*";color:var(--danger);margin-left:3px}
.steps{display:flex;align-items:center;gap:0;font-size:12px}
.steps div{display:flex;align-items:center;gap:7px;color:var(--ink-3)}
.steps div.on{color:var(--brand);font-weight:600}
.steps div.done{color:var(--ok)}
.steps i{width:18px;height:18px;border-radius:50%;border:1px solid currentColor;display:grid;place-items:center;font-style:normal;font-size:10.5px;font-weight:700}
.steps div.on i{background:var(--brand);border-color:var(--brand);color:#fff}
.steps div.done i{background:var(--ok);border-color:var(--ok);color:#fff}
.steps hr{flex:1;border:0;border-top:1px solid var(--line-2);margin:0 10px;min-width:22px}
.dropzone{border:1px dashed var(--line-2);border-radius:6px;padding:22px;text-align:center;color:var(--ink-2);background:var(--panel-2)}
.dropzone b{display:block;color:var(--ink);font-size:13px;margin-bottom:3px}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:5px;overflow:hidden}
.stat div{background:var(--panel);padding:10px 12px}
.stat span{display:block;font-size:11px;color:var(--ink-3)}
.stat strong{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.stat .g strong{color:var(--ok)} .stat .r strong{color:var(--danger)} .stat .b strong{color:var(--brand)}
.toast{position:fixed;left:50%;top:60px;transform:translateX(-50%);z-index:120;display:grid;gap:7px;justify-items:center;pointer-events:none}
.toast div{background:var(--ink);color:var(--panel);padding:8px 15px;border-radius:5px;font-size:12.5px;box-shadow:var(--shadow);animation:pop .16s}
.toast div.ok{background:var(--ok);color:#fff} .toast div.err{background:var(--danger);color:#fff}

.flowcard{padding:16px;overflow-x:auto}
.flowcard svg{display:block;min-width:820px}
.matrix td:first-child{font-weight:600;white-space:nowrap}
.matrix tr.hot td{background:color-mix(in srgb,var(--danger-weak) 60%,transparent)}
.matrix tr.hot td:first-child{color:var(--danger)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block}
.hide{display:none!important}
.rowgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.full{grid-column:1/-1}
@media (max-width:960px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;overflow-x:auto;align-items:center}
  .side .brand,.side footer,.navgroup>span{display:none}
  .navgroup{display:flex;padding:0}
  .navitem{border-left:0;border-bottom:2px solid transparent;white-space:nowrap}
  .navitem[aria-current="page"]{border-left:0;border-bottom-color:var(--brand)}
  body.anno .wrap{padding-right:20px}
  .annopanel{top:auto;width:100%;left:0;height:44vh;border-left:0;border-top:1px solid var(--line)}
}
</style>

<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="mark">Q</div>
      <div><b>Qbit Admin</b><small>Compliance Console</small></div>
    </div>
    <nav class="navgroup" id="nav">
      <span>API 客户业务</span>
      <button class="navitem" data-view="master"><i class="dot"></i>API 母户删卡<em class="tagnew">改</em></button>
      <button class="navitem" data-view="sub"><i class="dot"></i>API 子户批量删卡<em class="tagnew">改</em></button>
      <span style="margin-top:8px">量子卡</span>
      <button class="navitem" data-view="cardholder" aria-current="page"><i class="dot"></i>Cardholder 列表<em class="tagnew">改</em></button>
      <button class="navitem" data-view="detail"><i class="dot"></i>持卡人详情</button>
      <span style="margin-top:8px">合规风控</span>
      <button class="navitem" data-view="blacklist"><i class="dot"></i>自然人黑名单库<em class="tagnew">新</em></button>
      <button class="navitem" data-view="hits"><i class="dot"></i>黑名单命中明细<em class="tagnew">新</em></button>
      <span style="margin-top:8px">说明</span>
      <button class="navitem" data-view="spec"><i class="dot"></i>状态与流程说明</button>
    </nav>
    <footer>PD-2118 · V1.0 · 2026-09-07<br>原型稿，非线上页面</footer>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="crumb" id="crumb"></div>
      <div class="spacer"></div>
      <button class="ghosttoggle" id="annoBtn" aria-pressed="false"><i class="sw"></i>需求批注</button>
      <button class="ghosttoggle" id="themeBtn" aria-pressed="false" title="切换深浅色"><i class="sw"></i>深色</button>
    </header>
    <div class="wrap" id="wrap"></div>
  </div>
</div>

<aside class="annopanel">
  <h3>需求批注 <span id="annoCount"></span></h3>
  <div class="annolist" id="annoList"></div>
</aside>
<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

<script>

function toast(msg,kind=""){
  const d=document.createElement("div"); d.className=kind; d.textContent=msg;
  $("#toast").appendChild(d); setTimeout(()=>d.remove(),2600);
}
function maskVal(v,dim){
  if(!state.masked) return v;
  if(v.includes("@")){const [a,b]=v.split("@");return a.slice(0,1)+"***"+a.slice(-1)+"@"+b;}
  return "***-"+v.slice(-8);
}
function stTag(st){const s=ST[st];return `<span class="tag ${s.c} t-dot">${s.t}</span>`;}
let pinSeq=0;
function pin(){ return `<button class="pin" data-pin="${++pinSeq}" title="查看需求批注">${pinSeq}</button>`; }

function closeModal(){ $("#modalRoot").innerHTML=""; }
function openModal(html,cls=""){
  $("#modalRoot").innerHTML = `<div class="scrim" data-scrim><div class="modal ${cls}">${html}</div></div>`;
  const scrim=$("[data-scrim]");
  scrim.addEventListener("mousedown",e=>{ if(e.target===scrim) closeModal(); });
  $("#modalRoot").querySelectorAll("[data-close]").forEach(b=>b.onclick=closeModal);
}
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeModal(); });

function renderCH(){
  const tb=$("#chTable tbody"); if(!tb) return;
  const q=($("#fEmail")?.value||"").trim().toLowerCase();
  const st=$("#fSt")?.value||"";
  const rows=CH.filter(c=>(!q||c.email.toLowerCase().includes(q))&&(!st||c.st===st));
  tb.innerHTML = rows.map(c=>{
    const on=state.sel.has(c.id), gone=c.st==="deleted";
    const ops = gone
      ? `<button class="lnk m">已删除</button>`
      : (c.st==="controlled"
        ? `<button class="lnk" data-act="release" data-id="${c.id}">解除管控</button><button class="lnk d" data-act="delete" data-id="${c.id}">删除持卡人</button><button class="lnk" data-act="cards" data-id="${c.id}">名下卡片</button>`
        : `<button class="lnk" data-act="control" data-id="${c.id}">管控</button><button class="lnk d" data-act="delete" data-id="${c.id}">删除持卡人</button><button class="lnk" data-act="cards" data-id="${c.id}">名下卡片</button>`);
    return `<tr class="${on?'sel':''}">
      <td><input type="checkbox" class="chk" data-pick="${c.id}" ${on?"checked":""} ${gone?"disabled":""}></td>
      <td class="mono">${c.id}</td>
      <td>${esc(c.name)}</td>
      <td>${c.nat}</td>
      <td><span class="tag t-mute">${c.idt}</span><div class="mono" style="margin-top:3px">${c.idn}</div></td>
      <td>${esc(c.email)}</td>
      <td class="num">${c.cards} 张${c.pend?` <span class="tag t-warn">pending ${c.pend}</span>`:""}</td>
      <td><div class="mono">${c.acc}</div><div class="sub2">${esc(c.accName)}</div></td>
      <td>${stTag(c.st)}</td>
      <td class="ops">${ops}</td>
    </tr>`;
  }).join("") || `<tr><td colspan="10" style="text-align:center;color:var(--ink-3);padding:34px">无匹配数据</td></tr>`;
  $("#selN").textContent = state.sel.size;
}

  const list=NOTES[state.view]||[];
  $("#annoCount").textContent = list.length+" 条";
  $("#annoList").innerHTML = list.map((n,i)=>`<div class="annoitem" data-note="${i+1}"><div class="n">${i+1}</div><div><b>PRD ${n[0]} · ${n[1]}</b>${esc(n[2])}</div></div>`).join("")
    || `<div class="sub2" style="padding:6px">本页暂无批注。</div>`;
}

/* ============ 事件 ============ */
$("#nav").addEventListener("click",e=>{
  const b=e.target.closest(".navitem"); if(!b) return;
  state.view=b.dataset.view; state.sel.clear(); state.blSel.clear(); render(); window.scrollTo(0,0);
});
$("#annoBtn").onclick=e=>{
  const on=e.currentTarget.getAttribute("aria-pressed")==="true";
  e.currentTarget.setAttribute("aria-pressed",String(!on));
  document.body.classList.toggle("anno",!on);
};
$("#themeBtn").onclick=e=>{
  const on=e.currentTarget.getAttribute("aria-pressed")==="true";
  e.currentTarget.setAttribute("aria-pressed",String(!on));
  document.documentElement.setAttribute("data-theme", on?"light":"dark");
};

document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="chAll"){ CH.forEach(c=>{ if(c.st!=="deleted"){ t.checked?state.sel.add(c.id):state.sel.delete(c.id); } }); renderCH(); }
  if(t.dataset.pick){ t.checked?state.sel.add(t.dataset.pick):state.sel.delete(t.dataset.pick); renderCH(); }
  if(t.id==="blAll"){ BL.forEach(b=>{ if(b.st==="live"){ t.checked?state.blSel.add(b.id):state.blSel.delete(b.id); } }); renderBL(); }
  if(t.dataset.blpick){ t.checked?state.blSel.add(t.dataset.blpick):state.blSel.delete(t.dataset.blpick); renderBL(); }
  if(t.id==="maskTgl"){ state.masked=t.checked; renderBL(); }
  if(t.id==="maskTgl2"){ state.masked=t.checked; renderHits(); }
  if(t.id==="fEmail"||t.id==="fSt") renderCH();
});
document.addEventListener("input",e=>{ if(e.target.id==="fEmail") renderCH(); if(e.target.id==="bQ") renderBL(); if(e.target.id==="hQ") renderHits(); });

document.addEventListener("click",e=>{
  const t=e.target.closest("button"); if(!t) return;

  if(t.classList.contains("pin")){
    const n=t.dataset.pin;
    if(!document.body.classList.contains("anno")) $("#annoBtn").click();
    const item=$(`.annoitem[data-note="${n}"]`);
    document.querySelectorAll(".annoitem").forEach(a=>a.classList.remove("hot"));
    if(item){ item.classList.add("hot"); item.scrollIntoView({block:"center",behavior:"smooth"}); }
    return;
  }
  if(t.id==="doSearch"){ renderCH(); toast("已按筛选条件查询"); return; }
  if(t.id==="doReset"){ $("#fEmail").value=""; $("#fSt").value=""; renderCH(); return; }
  if(t.id==="bSearch"){ renderBL(); toast("已按筛选条件查询"); return; }
  if(t.id==="bReset"){ $("#bQ").value=""; $("#bDim").value=""; $("#bSt").value=""; $("#bSrc").value=""; renderBL(); return; }
  if(t.id==="hSearch"){ renderHits(); toast("已按筛选条件查询"); return; }
  if(t.id==="hReset"){ $("#hQ").value=""; $("#hDim").value=""; renderHits(); return; }
  if(t.id==="hExport"){ toast("导出中，文件含完整原始明文数据","ok"); return; }

  const open=t.dataset.open;
  if(open==="addBl") return modalAddBl();
  if(open==="import") return modalImport();
  if(open==="batchRelease") return modalBatchRelease();

  const bulk=t.dataset.bulk;
  if(bulk){
    let ids=[...state.sel];
    if(state.view!=="cardholder") ids=["h_123456","h_123902"];
    if(!ids.length) return toast("请先勾选持卡人","err");
    if(bulk==="delete") return modalDelete(ids);
    if(bulk==="control") return modalControl(ids,"control");
    if(bulk==="release") return modalControl(ids,"release");
    if(bulk==="retry") return toast("已重新发起处置，处理中…","ok");
  }
  const act=t.dataset.act, id=t.dataset.id;
  if(act==="delete") return modalDelete([id]);
  if(act==="control") return modalControl([id],"control");
  if(act==="release") return modalControl([id],"release");
  if(act==="cards"){ state.view="detail"; render(); return; }
  if(act==="release-bl"){ state.blSel=new Set([id]); return modalBatchRelease(); }
  if(act==="log") return modalLog(id);
  if(act==="hitsof"){ closeModal(); state.view="hits"; render(); $("#hQ").value=BL.find(b=>b.id===id).val; renderHits(); toast("已按该名单记录过滤命中明细"); return; }
  if(act==="hitdetail") return modalHitDetail(id);
  if(act==="jump"){ closeModal(); state.view="blacklist"; render();
    const row=$("#row-"+id); if(row){ row.classList.add("sel"); row.scrollIntoView({block:"center",behavior:"smooth"}); }
    toast("已定位到黑名单主记录 "+id); return; }
  if(act==="goblack"){ closeModal(); state.view="blacklist"; render(); return; }
  if(act==="retry-one") return toast("已重新发起删除，处理中…","ok");
});

render();
</script>

</body>
</html>
